[build]
  publish = "public"
  command = "echo 'static site — nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The page polls this; keep it uncached at the edge so the 15-minute refresh
# actually shows up. The function sets its own short cache-control.
[[headers]]
  for = "/.netlify/functions/data"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
