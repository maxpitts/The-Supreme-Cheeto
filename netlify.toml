[build]
  publish = "public"
  command = "echo 'static site — nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The function sets its own Cache-Control; a rule here would override it and
# reintroduce the stale-data bug. Left intentionally unset.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
